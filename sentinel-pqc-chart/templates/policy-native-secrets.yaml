{{- if .Values.features.nativeTlsSecrets.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: sentinel-pqc-enforce-native-tls
  labels:
    app.kubernetes.io/name: sentinel-pqc
    app.kubernetes.io/component: admission-controller
  annotations:
    policies.kyverno.io/title: Sentinel-PQC Hardcoded TLS Secret Scanner
    policies.kyverno.io/description: Blocks the manual uploading of non-compliant PQC cryptographic secrets into the cluster.
spec:
  validationFailureAction: {{ .Values.mode | quote }}
  background: true
  rules:
    - name: audit-manual-tls-secrets
      match:
        any:
        - resources:
            kinds:
              - v1/Secret
      # ----------------------------------------------------------------------
      # Dynamic Namespace Scope (Exclude)
      # ----------------------------------------------------------------------
      {{- if .Values.scope.excludeNamespaces }}
      exclude:
        any:
        - resources:
            namespaces:
            {{- range .Values.scope.excludeNamespaces }}
              - {{ . | quote }}
            {{- end }}
      {{- end }}
      
      validate:
        message: >-
          [Sentinel-PQC] FATAL: Manual upload of legacy TLS secrets is prohibited 
          under NSM-10. All new cryptographic assets must be provisioned via 
          approved PQC-compliant automated issuers.
        deny:
          conditions:
            any:
              # Targets Kubernetes Secrets specifically marked as TLS certificates
              - key: "{{ `{{ request.object.type }}` }}"
                operator: Equals
                value: "kubernetes.io/tls"
              # In a full enterprise deployment, this would use Kyverno's Cosign/JMESPath 
              # integration to decode the base64 certificate and read the exact algorithm. 
              # For this framework, we force teams to use automated cert-manager PQC issuers 
              # instead of uploading opaque, unaudited manual keys.
{{- end }}
